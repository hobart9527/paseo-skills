name: paseo-pipeline
version: 2
description: Paseo pipeline contract workflow - proposal → pure specs → design (on demand) → tasks/compiled acceptance → review (R0)
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Capture why, what changes, capabilities and impact. List new and modified capabilities with exact existing paths where applicable. If no spec-level behavior changes, set `skip_specs: true` in `.openspec.yaml`; never invent a requirement to satisfy validation.
      Keep proposal concise. Put verified baseline facts supporting changed rules in `## Baseline` (or Stage 0/1 `baseline-facts.md`) as `path:line` and one-line consequence. Material unsettled decisions use the proposal.md `OPEN-DECISION` entry; follow author.md's open-hard stop rule and return `BLOCKED (decision)`. No repository survey, digest or alignment table.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed observable specifications for the change
    template: spec.md
    instruction: |
      Specify observable behavior, inputs, outputs, errors, external constraints and testable scenarios; avoid implementation details. Executable `Verify` commands belong in `tasks.md` (single source of truth; legacy `- **Verify:**` lines remain supported).
      Create one spec per proposal capability. Use exact paths: new capabilities at `specs/<capability-path>/spec.md`; modified capabilities at the existing path. A zero-delta change requires `skip_specs: true`.
      Use delta headings `ADDED`, `MODIFIED`, `REMOVED`, or `RENAMED Requirements`. A requirement is `### Requirement: <name>` with SHALL/MUST language and at least one `#### Scenario:` in WHEN/THEN form. Use four hashes for scenarios. New capability specs begin `## Purpose` (50+ characters); do not add Purpose to existing capabilities' deltas. MODIFIED requirements contain the complete updated text and retain unchanged scenarios verbatim; REMOVED includes Reason and Migration; RENAMED uses FROM/TO.
      Every scenario heading has one stable `SCEN-<CAP>-NN` id. Freeze-check reconciles ids with task claims. Keep specs as pure observable behavior (`Verify with:` lives ONLY in `tasks.md`). Declare each once; freeze id set after specs. Never renumber/reword to evade collisions. Baseline id reuse belongs under MODIFIED/REMOVED; active-change conflicts require coordination. Concurrent tasks share one authoritative reachable interface contract. Cite only supporting baseline facts.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create only for cross-module/pattern changes, new dependency or significant data model, security/performance/migration complexity, or material technical ambiguity. Otherwise omit.
      Explain current constraints, design goals/non-goals, key decisions and rationale, risks/trade-offs, applicable migration and genuinely deferrable open questions. Prefer a Wave 0 `Kind: skeleton` typed stub for shared cross-layer interfaces instead of copying field-level TypeScript types into prose. Resolve choices that alter specs, approach or task breakdown with the human. Do not repeat proposal or specs; keep task-local decisions with workers.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Implementation checklist and single source of truth for Entry, Verify, and Required
    template: tasks.md
    instruction: |
      Follow `lib/tasks.mjs` syntax exactly and use the template. Each checkbox task has ID, one-line goal, dependencies, Write scope, `Entry:` (real route/UI/CLI, or `SCEN-ID=<entry>; ...`), `Verify with:`, claimed scenarios, optional `Required: yes|no` (default `yes`), and only needed optional metadata. Invalid task lines can disappear from scheduling; run structural freeze-check.
      IDs match letters-digits; Write paths are repo-relative and non-empty. Dependencies exist, are acyclic and not self-referential. `Uses` is a dispatch edge for committed skeleton interfaces; overlapping Write scopes require real `Depends on`. `Reads` grants no ownership. Each non-sink Verify is executable, narrow and exercises a path in Write/Reads; sink may run full suite. Structural checks do not prove runtime behavior.
      Claim each declared SCEN at least once. Keep vertical slices and concurrent Write scopes disjoint; do not pad DAG. Tasks should complete in one session. Sink verification-only work is allowed when upstream owns the entry; treat checker advisory as review input, not proof of missing ownership.
      Before commit, ensure each scenario's acceptance Entry is owned or reachable through dependency, Verify exercises real behavior and fails before implementation, and referenced symbols/paths exist or are created. Design decisions use `D-xx`; tasks reference only existing decisions. See template for metadata parser rules and deeper task constraints.
    requires:
      - specs

  - id: acceptance
    generates: acceptance.md
    description: Business acceptance matrix compiled deterministically by acceptance sync
    template: acceptance.md
    instruction: |
      This frozen matrix is sole delivery authority, compiled deterministically via `pipeline-run.mjs acceptance sync <change-dir>` from `specs/` and `tasks.md`. Include every declared SCEN at least once. Rows may share Entry/Verify and reuse existing tests. `tasks.md` owns `Scenarios`, `Entry`, `Verify`, and `Required`; `acceptance.md` is its compiled projection.
      Exact columns in order: Scenario, Entry, Tasks, Verify, Required, Result, Evidence. Entry is real user-facing route/UI/CLI/wiring, not internal function. Verify executes Entry; Required=yes needs executable command. Freeze Result as PENDING and Evidence as pending; record outcomes externally with full source SHA. External evidence does not replace matrix or authorize CP-2. Failed or blocked rows do not satisfy CP-2. Mocks alone are not acceptance.
    requires:
      - specs
      - tasks

  - id: review
    generates: review.md
    description: R0 contract review sign-off
    template: review.md
    instruction: |
      Main session records the independent R0 contract review (stage title `[Pipeline] anchasi R0`; reviewer is an independent profile, not the authors; legacy `neon R0`/`hanlin R0` sign-offs remain readable). First line is exactly `R0: pass(<reviewer-agent-uuid>@<reviewed-commit-sha>)`, followed by findings and author responses. For human-accepted residual blockers, use `R0: human-accept(@<reviewed-commit-sha>)`, record verbatim approval in run-log.md and open items in rulings.md. Human-accept is never a reviewer pass. Freeze-check rejects missing/unknown signer or any contract change after signed commit. Never prewrite sign-off.
    requires:
      - tasks
      - acceptance

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Stop unless R0 is closed by `R0: pass(<uuid>@<sha>)` or `R0: human-accept(@<sha>)` in `review.md`. Then `pipeline-run.mjs plan` reads the DAG and reports dispatch; never hand-edit Done/check boxes or scheduling state. Structural freeze-check is a validation dependency, not authorization to execute tasks.
