name: paseo-pipeline
version: 2
description: Paseo pipeline contract workflow - proposal → specs → design (on demand) → tasks/acceptance → review (R0)
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Capture why, what changes, capabilities and impact. List new and modified capabilities with exact existing paths where applicable. If no spec-level behavior changes, set `skip_specs: true` in `.openspec.yaml`; never invent a requirement to satisfy validation.
      Keep proposal concise. Put verified baseline facts supporting changed rules in `## Baseline` as `path:line` and one-line consequence. Material unsettled decisions use `## OPEN-DECISION` with options, consequences and recommended default. No repository survey, digest or alignment table.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Specify observable behavior, inputs, outputs, errors, external constraints and testable scenarios; avoid implementation details.
      Create one spec per proposal capability. Use exact paths: new capabilities at `specs/<capability-path>/spec.md`; modified capabilities at the existing path. A zero-delta change requires `skip_specs: true`.
      Use delta headings `ADDED`, `MODIFIED`, `REMOVED`, or `RENAMED Requirements`. A requirement is `### Requirement: <name>` with SHALL/MUST language and at least one `#### Scenario:` in WHEN/THEN form. Use four hashes for scenarios. New capability specs begin `## Purpose` (50+ characters); do not add Purpose to existing capabilities' deltas. MODIFIED requirements contain the complete updated text and retain unchanged scenarios verbatim; REMOVED includes Reason and Migration; RENAMED uses FROM/TO.
      Every scenario heading has one stable `SCEN-<CAP>-NN` id. Freeze-check reconciles ids with task claims. Declare each once; freeze id set after specs. Never renumber/reword to evade collisions. Baseline id reuse belongs under MODIFIED/REMOVED; active-change conflicts require coordination. Concurrent tasks share one authoritative reachable interface contract. Cite only supporting baseline facts.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create only for cross-module/pattern changes, new dependency or significant data model, security/performance/migration complexity, or material technical ambiguity. Otherwise omit.
      Explain current constraints, design goals/non-goals, key decisions and rationale, risks/trade-offs, applicable migration and genuinely deferrable open questions. Resolve choices that alter specs, approach or task breakdown with the human. Do not repeat proposal or specs; keep task-local decisions with workers.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Follow `lib/tasks.mjs` syntax exactly and use the template. Each checkbox task has ID, one-line goal, dependencies, Write scope, Verify, claimed scenarios and only needed optional metadata. Invalid task lines can disappear from scheduling; run structural freeze-check.
      IDs match letters-digits; Write paths are repo-relative and non-empty. Dependencies exist, are acyclic and not self-referential. `Uses` is a dispatch edge for committed skeleton interfaces; overlapping Write scopes require real `Depends on`. `Reads` grants no ownership. Each non-sink Verify is executable, narrow and exercises a path in Write/Reads; sink may run full suite. Structural checks do not prove runtime behavior.
      Claim each declared SCEN at least once. Keep vertical slices and concurrent Write scopes disjoint; do not pad DAG. Tasks should complete in one session. Sink verification-only work is allowed when upstream owns the entry; treat checker advisory as review input, not proof of missing ownership.
      Before commit, ensure each scenario's acceptance Entry is owned or reachable through dependency, Verify exercises real behavior and fails before implementation, and referenced symbols/paths exist or are created. Design decisions use `D-xx`; tasks reference only existing decisions. See template for metadata parser rules and deeper task constraints.
    requires:
      - specs

  - id: acceptance
    generates: acceptance.md
    description: Business acceptance matrix frozen with the change
    template: acceptance.md
    instruction: |
      This frozen matrix is sole delivery authority. Include every declared SCEN at least once. Rows may share Entry/Verify and reuse existing tests. `tasks.md` Scenarios is claim source; each Tasks cell lists only claimants, and all rows together cover all claimants.
      Use exact columns in this order: Scenario, Entry, Tasks, Verify, Required, Result, Evidence. Entry is real user-facing route/UI/CLI/wiring, not internal function. Verify executes Entry; Required=yes needs executable command. Required reflects delivery semantics. Freeze Result as PENDING and Evidence as pending; record outcomes externally with full source SHA. External evidence does not replace matrix or authorize CP-2. Failed or blocked rows do not satisfy CP-2. Mocks alone are not acceptance.
    requires:
      - specs

  - id: review
    generates: review.md
    description: R0 contract review sign-off
    template: review.md
    instruction: |
      Main session records read-only `hanlin` review. First line is exactly `R0: pass(<hanlin-agent-uuid>@<reviewed-commit-sha>)`, followed by findings and author responses. For human-accepted residual blockers, use `R0: human-accept(@<reviewed-commit-sha>)`, record verbatim approval in run-log.md and open items in rulings.md. Human-accept is never a reviewer pass. Freeze-check rejects missing/unknown signer or any contract change after signed commit. Never prewrite sign-off.
    requires:
      - tasks
      - acceptance

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Stop unless R0 is closed by `R0: pass(<uuid>@<sha>)` or `R0: human-accept(@<sha>)` in `review.md`. Then `pipeline-run.mjs plan` reads the DAG and reports dispatch; never hand-edit Done/check boxes or scheduling state. Structural freeze-check is a validation dependency, not authorization to execute tasks.
